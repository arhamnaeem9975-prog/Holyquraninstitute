<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2546"/>
      <stop offset="100%" stop-color="#00102A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background Circle / Octagon with Navy base -->
  <rect width="64" height="64" rx="16" fill="url(#navyGrad)"/>
  
  <!-- Outer Gold Geometric 8-Point Star Border (Rub el Hizb inspired) -->
  <g transform="translate(32,32) scale(0.85) translate(-32,-32)" opacity="0.35">
    <rect x="14" y="14" width="36" height="36" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="36" rx="3" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" transform="rotate(45 32 32)"/>
  </g>

  <!-- Quran Rehal / Open Book Icon in Gold -->
  <g filter="url(#glow)">
    <!-- Book Stand (Rehal) Base -->
    <path d="M22 47 L32 39 L42 47 M26 49 L32 44 L38 49" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Left Quran Page -->
    <path d="M32 37 C27 34 20 33.5 15 36.5 L15 22 C20 19 27 19.5 32 23.5 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Right Quran Page -->
    <path d="M32 37 C37 34 44 33.5 49 36.5 L49 22 C44 19 37 19.5 32 23.5 Z" fill="url(#navyGrad)" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Spine Line & Center Calligraphy Arc -->
    <line x1="32" y1="23.5" x2="32" y2="37.5" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="32" cy="18" r="2.2" fill="url(#goldGrad)"/>
    <circle cx="32" cy="12" r="1.2" fill="#F3E5AB"/>
    
    <!-- Page Lines on Left & Right -->
    <path d="M19 25.5 Q24 23.5 28 26 M19 29 Q24 27 28 29.5 M19 32.5 Q24 30.5 28 33" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
    <path d="M45 25.5 Q40 23.5 36 26 M45 29 Q40 27 36 29.5 M45 32.5 Q40 30.5 36 33" stroke="#D4AF37" stroke-width="1" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>
